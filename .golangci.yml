version: 2

linters-settings:
  gosec:
    excludes:
      - G304 # Exclude file inclusion warnings in tests
    config:
      G304:
        # Allow file operations in test files
        severity: "low"

linters:
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
      text: "G304"

run:
  timeout: 5m
  tests: true
