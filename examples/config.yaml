kube:
  context: ""  # Empty string uses default context

prometheus:
  url: "http://prometheus-operated.monitoring:9090"
  timeoutSeconds: 10

analysis:
  window: "7d"
  cpuPercentile: 0.95
  memPercentile: 0.95
  safetyFactor: 1.2
  minCpuMilli: 20
  minMemMi: 64

hpa:
  minReplicasFactor: 0.8
  maxReplicasFactor: 1.3

filters:
  namespacesExclude:
    - kube-system
    - monitoring
  labelSelector: ""

output:
  dir: "./out"
  format:
    - md
    - json
    - patch

llm:
  enabled: false
  provider: "openai"  # Options: "openai", "claude"
  model: "gpt-4"
  maxTokens: 1200
  temperature: 0.2
